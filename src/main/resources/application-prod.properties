spring.application.name=AirBnb

server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/airbnb?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secretKey=${JWT_SECRET_KEY}

stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_demo}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_demo}

frontend.url=${FRONTEND_URL:https://example.com}

app.demo.seed=${APP_DEMO_SEED:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
