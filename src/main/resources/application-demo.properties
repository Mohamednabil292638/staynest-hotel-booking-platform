spring.application.name=AirBnb

server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# In-memory H2 — no external DB cost; data resets on each cold start
spring.datasource.url=jdbc:h2:mem:airbnb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false

spring.h2.console.enabled=false

jwt.secretKey=${JWT_SECRET_KEY:demo-jwt-secret-change-in-production-min-32-chars}

stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_demo}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_demo}

frontend.url=${FRONTEND_URL:https://example.com}

app.demo.seed=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
